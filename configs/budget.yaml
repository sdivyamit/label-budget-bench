# API money. The runner never spends past `credit_usd - safety_margin_usd` for a vendor.
#
# credit_usd: money available to THIS project on that vendor account, counted from the first
#   ledger entry. When you recharge, ADD the recharge amount here, then rerun the same command;
#   finished items are cached and never paid for twice.
# Prices: USD per 1M tokens, checked 10 Nov 2026 (OpenAI and Google pricing pages, TypeSafe
#   pricing page). Re-check before each run; Gemini 4 Argon doubles on 1 Dec 2026.

vendors:
  openai:   {credit_usd: 30.0, safety_margin_usd: 3.0}
  gemini:   {credit_usd: 30.0, safety_margin_usd: 3.0}
  typesafe: {credit_usd: 5.0,  safety_margin_usd: 0.5}

prices:
  gpt-5.6-sol:
    sync:  {input: 4.00, cached: 0.40, output: 20.00}
    batch: {input: 2.00, cached: 0.20, output: 10.00}
  gpt-5.6-luna:
    sync:  {input: 0.20, cached: 0.02, output: 1.20}
    batch: {input: 0.10, cached: 0.01, output: 0.60}
  gpt-6.1-sol:
    sync:  {input: 2.00, cached: 0.10, output: 10.00}
    batch: {input: 1.00, cached: 0.05, output: 5.00}
  gpt-6-luna:
    sync:  {input: 0.10, cached: 0.01, output: 0.50}
    batch: {input: 0.05, cached: 0.005, output: 0.25}
  gemini-4-argon:                       # introductory until 30 Nov 2026; x2 from 1 Dec
    sync:  {input: 2.00, cached: 0.10, output: 10.00}
    batch: {input: 1.00, cached: 0.10, output: 5.00}
  gemini-3.5-flash-lite:
    sync:  {input: 0.30, cached: 0.03, output: 2.50}
    batch: {input: 0.15, cached: 0.03, output: 1.25}
  jev-1.14.0:
    sync:  {input: 0.042, cached: 0.042, output: 0.0}

# Stop a job (and say how much to recharge) if its projected cost from the dry run exceeds this.
max_job_usd: 60.0
dry_run_items: 50
